name: Prepare and verify media coverage
on:
  push:
    paths:
      - '.github/workflows/inspect-media-logos.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install Pillow==12.3.0 cairosvg
      - name: Prepare logo assets and website changes
        shell: python
        run: |
          import urllib.request, urllib.parse, json, io, subprocess, base64, hashlib
          from pathlib import Path
          from PIL import Image, ImageChops
          import cairosvg
          edits=json.loads(r'''{"src/components/MediaCards.tsx":"import type { MediaMention } from '@/data/projects';\nimport { ResponsiveImage } from '@/components/ResponsiveImage';\nimport { assetPath } from '@/lib/sitePath';\nimport styles from './MediaCards.module.css';\n\nconst images: Record<string, string> = {\n  'The Hague Online': '/images/media-hague-online.jpg',\n  ImpactCity: '/images/media-impactcity.jpg',\n  'Den Haag FM': '/images/pillenpopper-product.webp',\n  AD: '/images/pillenpopper-product.webp',\n  'Omroep Delft': '/images/pillenpopper-blister.jpg',\n  'Haagse Dingen': '/images/media-haagse-dingen.jpg',\n  'De Ondernemer': '/images/pillenpopper-product.webp',\n};\n\nconst sourceLogos: Record<string, string> = {\n  AD: '/images/press-logos/ad-logo.png',\n  'Omroep Delft': '/images/press-logos/omroep-delft-logo.png',\n  'De Nieuwe Haagse Courant': '/images/press-logos/dnhc-logo.png',\n  'Den Haag FM': '/images/press-logos/den-haag-fm-logo.png',\n  'The Hague Online': '/images/press-logos/hague-online-logo.png',\n  ImpactCity: '/images/press-logos/impactcity-logo.png',\n  'Haagse Dingen': '/images/press-logos/haagse-dingen-logo.png',\n  'De Ondernemer': '/images/press-logos/de-ondernemer-logo.png',\n  'Hofstad Radio': '/images/press-logos/hofstad-radio-logo.png',\n  Dagblad070: '/images/press-logos/dagblad070-logo.png',\n  'Duurzaam Ondernemen': '/images/press-logos/duurzaam-ondernemen-logo.png',\n  'Zoetermeers Dagblad': '/images/press-logos/zoetermeers-dagblad-logo.png',\n  'Rijswijks Dagblad': '/images/press-logos/rijswijks-dagblad-logo.png',\n};\n\nexport function MediaCards({\n  mentions,\n  featured = false,\n  label,\n}: {\n  mentions: MediaMention[];\n  featured?: boolean;\n  label?: string;\n}) {\n  return (\n    <div\n      className={`${styles.grid}${featured ? ` ${styles.featured}` : ''}`}\n      role={featured ? 'region' : undefined}\n      aria-label={featured ? label : undefined}\n      tabIndex={featured ? 0 : undefined}\n    >\n      {mentions.map((mention) => {\n        const logo = sourceLogos[mention.source ?? ''];\n        const hasSeparateLinks = !!mention.linkLabel || !!mention.additionalLinks?.length;\n        const links = [\n          ...(mention.href && mention.linkLabel ? [{ label: mention.linkLabel, href: mention.href }] : []),\n          ...(mention.additionalLinks ?? []),\n        ];\n        return (\n          <article className={styles.card} key={`${mention.source}-${mention.title}`}>\n            <div className={styles.thumbnail}>\n              <ResponsiveImage\n                src={assetPath(images[mention.source ?? ''] ?? '/images/pillenpopper-blister.jpg')}\n                alt=\"\"\n                sizes={featured ? \"(min-width: 1000px) 390px, (min-width: 700px) 360px, 82vw\" : \"(min-width: 1000px) 144px, (min-width: 700px) 180px, 28vw\"}\n                className={styles.image}\n                loading=\"lazy\"\n              />\n            </div>\n            <div className={styles.content}>\n              <h3 className={styles.title}>\n                {mention.href && !hasSeparateLinks ? (\n                  <a className={styles.mainLink} href={mention.href} target=\"_blank\" rel=\"noopener noreferrer\">\n                    {mention.title}\n                  </a>\n                ) : mention.title}\n              </h3>\n              {links.length > 0 && (\n                <div className={styles.links}>\n                  {links.map((link) => (\n                    <a className={styles.extraLink} href={link.href} key={link.href} target=\"_blank\" rel=\"noopener noreferrer\">\n                      {link.label}\n                    </a>\n                  ))}\n                </div>\n              )}\n              <div className={styles.footer}>\n                <div className={styles.source}>\n                  {logo ? (\n                    <ResponsiveImage\n                      src={assetPath(logo)}\n                      alt={mention.source ?? ''}\n                      className={styles.sourceLogo}\n                      sizes=\"112px\"\n                      loading=\"lazy\"\n                    />\n                  ) : <span>{mention.source}</span>}\n                </div>\n                {mention.date && <p className={styles.date}>{mention.date}</p>}\n              </div>\n            </div>\n          </article>\n        );\n      })}\n    </div>\n  );\n}\n","src/components/MediaCards.module.css":".grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 20px;\n  margin-top: 28px;\n}\n.card {\n  display: grid;\n  grid-template-columns: 144px minmax(0, 1fr);\n  min-width: 0;\n  overflow: hidden;\n  border: 1px solid var(--color-border, #d8dde1);\n  border-radius: 12px;\n  background: #ffffff;\n  color: var(--color-text, #20222e);\n}\n.thumbnail { min-width: 0; background: #eeedf0; }\n.image { display: block; width: 100%; height: 100%; min-height: 172px; object-fit: cover; }\n.content { display: flex; flex-direction: column; min-width: 0; padding: 20px; }\n.title { margin: 0; font-size: 17px; line-height: 1.5; font-weight: 650; overflow-wrap: anywhere; }\n.mainLink { color: inherit; text-decoration: none; }\n.mainLink:hover { color: var(--color-steel, #4f6d8a); text-decoration: underline; text-underline-offset: 4px; }\n.links { display: flex; flex-direction: column; align-items: flex-start; gap: 0; margin-top: 8px; }\n.extraLink { display: inline-flex; align-items: center; min-height: 32px; color: var(--color-text, #20222e); font-size: 13px; line-height: 1.5; text-decoration: underline; text-underline-offset: 3px; }\n.extraLink:hover { text-decoration-thickness: 2px; }\n.footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-top: auto; padding-top: 16px; }\n.date { margin: 0; font-size: 12px; line-height: 1.5; color: #5e626d; }\n.source { display: flex; align-items: center; justify-content: center; width: 132px; height: 36px; max-width: 100%; padding: 5px 10px; background: #ffffff; color: #20222e; font-size: 12px; line-height: 1.2; font-weight: 650; text-align: center; }\n.sourceLogo { display: block; width: 112px; height: 26px; max-width: 100%; object-fit: contain; object-position: center; }\n.mainLink:focus-visible, .extraLink:focus-visible { outline: 3px solid var(--color-steel, #4f6d8a); outline-offset: 4px; border-radius: 2px; }\n@media (min-width: 700px) and (max-width: 999px) {\n  .grid { grid-template-columns: 1fr; }\n  .card { grid-template-columns: 180px minmax(0, 1fr); }\n}\n@media (max-width: 699px) {\n  .grid { grid-template-columns: 1fr; gap: 16px; }\n  .card { grid-template-columns: 28% minmax(0, 1fr); }\n  .content { padding: 16px; }\n  .title { font-size: 16px; line-height: 1.45; }\n  .footer { gap: 8px; padding-top: 12px; }\n}\n\n.featured {\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  align-items: stretch;\n}\n.featured .card { display: flex; flex-direction: column; }\n.featured .thumbnail { height: 168px; }\n.featured .image { height: 168px; min-height: 0; }\n.featured .content { flex: 1; }\n.featured:focus-visible { outline: 3px solid var(--color-steel, #4f6d8a); outline-offset: 4px; border-radius: 12px; }\n@media (max-width: 999px) {\n  .featured {\n    grid-template-columns: none;\n    grid-auto-flow: column;\n    grid-auto-columns: min(82%, 360px);\n    overflow-x: auto;\n    overscroll-behavior-x: contain;\n    scroll-snap-type: x mandatory;\n    scroll-padding-inline: 2px;\n    gap: 16px;\n    padding: 2px 2px 14px;\n    scrollbar-width: thin;\n    scrollbar-color: var(--color-steel, #4f6d8a) #eeedf0;\n  }\n  .featured .card { scroll-snap-align: start; }\n  .featured::-webkit-scrollbar { height: 6px; }\n  .featured::-webkit-scrollbar-track { background: #eeedf0; border-radius: 3px; }\n  .featured::-webkit-scrollbar-thumb { background: var(--color-steel, #4f6d8a); border-radius: 3px; }\n}\n","src/components/MediaCoverage.tsx":"import { ChevronDown } from 'lucide-react';\nimport type { MediaMention } from '@/data/projects';\nimport { MediaCards } from '@/components/MediaCards';\nimport styles from './MediaCoverage.module.css';\n\nconst featuredSources = ['AD', 'Omroep Delft', 'De Ondernemer'];\n\nexport function MediaCoverage({\n  mentions,\n  locale = 'en',\n}: {\n  mentions: MediaMention[];\n  locale?: 'en' | 'nl';\n}) {\n  const featured = featuredSources.flatMap((source) => {\n    const mention = mentions.find((item) => item.source === source);\n    return mention ? [mention] : [];\n  });\n  const selected = new Set(featured);\n  const remaining = mentions.filter((mention) => !selected.has(mention));\n  const nl = locale === 'nl';\n\n  if (featured.length === 0) return <MediaCards mentions={mentions} />;\n\n  return (\n    <div>\n      <MediaCards\n        mentions={featured}\n        featured\n        label={nl ? 'Uitgelichte media: AD, Omroep Delft en De Ondernemer' : 'Featured coverage: AD, Omroep Delft and De Ondernemer'}\n      />\n      <p className={styles.swipeHint}>\n        {nl ? 'Veeg om de uitgelichte artikelen te bekijken.' : 'Swipe to explore the featured stories.'}\n      </p>\n      {remaining.length > 0 && (\n        <details className={styles.more}>\n          <summary className={styles.toggle}>\n            <span className={styles.show}>\n              {nl ? `Bekijk de overige ${remaining.length} vermeldingen` : `Show ${remaining.length} more media mentions`}\n            </span>\n            <span className={styles.hide}>\n              {nl ? 'Minder vermeldingen tonen' : 'Show fewer media mentions'}\n            </span>\n            <ChevronDown className={styles.chevron} size={18} aria-hidden=\"true\" />\n          </summary>\n          <MediaCards mentions={remaining} />\n        </details>\n      )}\n    </div>\n  );\n}\n","src/components/MediaCoverage.module.css":".swipeHint { display: none; margin: 8px 0 0; color: #5e626d; font-size: 13px; line-height: 1.5; }\n.more { margin-top: 24px; }\n.toggle {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 12px;\n  min-height: 48px;\n  max-width: 100%;\n  padding: 12px 18px;\n  border: 1px solid var(--color-border, #d8dde1);\n  border-radius: 10px;\n  background: #ffffff;\n  color: var(--color-text, #20222e);\n  font-size: 14px;\n  line-height: 1.5;\n  font-weight: 600;\n  cursor: pointer;\n  list-style: none;\n}\n.toggle::-webkit-details-marker { display: none; }\n.toggle:hover { background: #f3f5f7; border-color: var(--color-steel, #4f6d8a); }\n.toggle:focus-visible { outline: 3px solid var(--color-steel, #4f6d8a); outline-offset: 4px; }\n.chevron { flex: 0 0 auto; }\n.hide { display: none; }\n.more[open] > .toggle .show { display: none; }\n.more[open] > .toggle .hide { display: inline; }\n.more[open] > .toggle .chevron { transform: rotate(180deg); }\n@media (max-width: 999px) { .swipeHint { display: block; } }\n@media (max-width: 699px) { .toggle { width: 100%; justify-content: space-between; text-align: left; } }\n","src/components/MediaSection.tsx":"import type { MediaMention } from '@/data/projects';\nimport { MediaCoverage } from '@/components/MediaCoverage';\n\nexport function MediaSection({\n  mentions,\n  locale = 'en',\n}: {\n  mentions: MediaMention[];\n  locale?: 'en' | 'nl';\n}) {\n  if (mentions.length === 0) {\n    return (\n      <div className=\"rounded-card border border-dashed border-border bg-card p-6\">\n        <p className=\"font-semibold text-text\">{locale === 'nl' ? 'In de media' : 'In the media'}</p>\n      </div>\n    );\n  }\n\n  return (\n    <div>\n      <h2 className=\"text-2xl font-semibold text-text\">{locale === 'nl' ? 'In de media' : 'In the media'}</h2>\n      <MediaCoverage mentions={mentions} locale={locale} />\n    </div>\n  );\n}\n","src/app/page.tsx":"import { MediaCoverage } from '@/components/MediaCoverage';\nimport { FounderPortrait } from '@/components/FounderPortrait';\nimport type { Metadata } from 'next';\nimport Link from 'next/link';\nimport { ButtonLink } from '@/components/ButtonLink';\nimport { MetricCard } from '@/components/MetricCard';\nimport { ProjectCard } from '@/components/ProjectCard';\nimport { SectionHeader } from '@/components/SectionHeader';\nimport { SplitCta } from '@/components/SplitCta';\nimport { editableMetrics, mediaHighlights, projects } from '@/data/projects';\n\nexport const metadata: Metadata = {\n  alternates: {\n    canonical: '/',\n    languages: { en: '/', nl: '/nl/' },\n  },\n};\n\nexport default function HomePage() {\n  return (\n    <>\n      <section className=\"border-b border-border bg-background\">\n        <div className=\"mx-auto grid max-w-7xl gap-10 px-5 py-14 md:grid-cols-[1.05fr_0.95fr] md:items-center md:py-16 lg:px-8\">\n          <div>\n            <p className=\"mb-5 text-sm font-semibold uppercase text-steel\">Product portfolio</p>\n            <h1 className=\"hero-title max-w-4xl font-semibold text-text\">\n              Creating physical products in a digital-first world.\n            </h1>\n            <p className=\"mt-6 max-w-2xl text-lg leading-8 text-muted\">\n              Core Solutions exists to turn everyday problems into useful products people can actually use.\n            </p>\n            <div className=\"mt-8 flex flex-wrap gap-3\">\n              <ButtonLink href=\"/portfolio/\">View portfolio</ButtonLink>\n              <ButtonLink href=\"/contact/\" variant=\"secondary\">Contact</ButtonLink>\n            </div>\n          </div>\n          <FounderPortrait />\n        </div>\n      </section>\n\n      <section className=\"mx-auto max-w-7xl px-5 py-16 lg:px-8\">\n        <div className=\"mb-8 flex flex-col gap-4 md:flex-row md:items-end md:justify-between\">\n          <SectionHeader eyebrow=\"Portfolio\" title=\"Featured product brands\" />\n          <Link className=\"font-semibold text-steel hover:text-primary\" href=\"/portfolio/\">View all</Link>\n        </div>\n        <div className=\"grid gap-6 md:grid-cols-2 xl:grid-cols-3\">\n          {projects.map((project) => (\n            <ProjectCard key={project.slug} project={project} />\n          ))}\n        </div>\n      </section>\n\n      <section className=\"border-y border-border bg-card\">\n        <div className=\"mx-auto grid max-w-7xl gap-10 px-5 py-16 md:grid-cols-[0.9fr_1.1fr] lg:px-8\">\n          <SectionHeader\n            eyebrow=\"Approach\"\n            title=\"From idea to market\"\n            description=\"Core Solutions brings product ideas from problem discovery to validation, design, testing, branding, production and commercialization. Each project starts with a practical problem and is developed into a clear product proposition.\"\n          />\n          <div className=\"grid gap-4 sm:grid-cols-3\">\n            {editableMetrics.map((metric) => (\n              <MetricCard key={metric.label} {...metric} />\n            ))}\n          </div>\n        </div>\n      </section>\n\n      <section className=\"mx-auto max-w-7xl px-5 py-16 lg:px-8\">\n        <SectionHeader\n          eyebrow=\"In the media\"\n          title=\"Coverage, mentions and product stories\"\n        />\n        <MediaCoverage mentions={mediaHighlights} />\n      </section>\n\n      <SplitCta />\n    </>\n  );\n}\n","src/app/nl/page.tsx":"import { MediaCoverage } from '@/components/MediaCoverage';\nimport { FounderPortrait } from '@/components/FounderPortrait';\nimport type { Metadata } from 'next';\nimport Link from 'next/link';\nimport { ButtonLink } from '@/components/ButtonLink';\nimport { MetricCard } from '@/components/MetricCard';\nimport { ProjectCard } from '@/components/ProjectCard';\nimport { SectionHeader } from '@/components/SectionHeader';\nimport { SplitCta } from '@/components/SplitCta';\nimport { editableMetricsNl, mediaHighlightsNl, projectsNl } from '@/data/projects.nl';\n\nexport const metadata: Metadata = {\n  title: 'Praktische productoplossingen',\n  description:\n    'Core Solutions ontwikkelt en commercialiseert praktische productmerken, waaronder iHeel®, BATBOX® en PillenPopper.',\n  alternates: {\n    canonical: '/nl/',\n    languages: { en: '/', nl: '/nl/' },\n  },\n  openGraph: {\n    title: 'Core Solutions | Praktische productoplossingen',\n    description:\n      'Core Solutions ontwikkelt en commercialiseert praktische productmerken, waaronder iHeel®, BATBOX® en PillenPopper.',\n    url: '/nl/',\n    locale: 'nl_NL',\n  },\n};\n\nexport default function DutchHomePage() {\n  return (\n    <>\n      <section className=\"border-b border-border bg-background\">\n        <div className=\"mx-auto grid max-w-7xl gap-10 px-5 py-14 md:grid-cols-[1.05fr_0.95fr] md:items-center md:py-16 lg:px-8\">\n          <div>\n            <p className=\"mb-5 text-sm font-semibold uppercase text-steel\">Productportfolio</p>\n            <h1 className=\"hero-title max-w-4xl font-semibold text-text\">\n              Fysieke producten creëren in een digital-first wereld.\n            </h1>\n            <p className=\"mt-6 max-w-2xl text-lg leading-8 text-muted\">\n              Core Solutions vertaalt alledaagse problemen naar bruikbare producten die mensen\n              echt kunnen gebruiken.\n            </p>\n            <div className=\"mt-8 flex flex-wrap gap-3\">\n              <ButtonLink href=\"/nl/portfolio/\">Bekijk portfolio</ButtonLink>\n              <ButtonLink href=\"/nl/contact/\" variant=\"secondary\">\n                Contact\n              </ButtonLink>\n            </div>\n          </div>\n          <FounderPortrait locale=\"nl\" />\n        </div>\n      </section>\n\n      <section className=\"mx-auto max-w-7xl px-5 py-16 lg:px-8\">\n        <div className=\"mb-8 flex flex-col gap-4 md:flex-row md:items-end md:justify-between\">\n          <SectionHeader eyebrow=\"Portfolio\" title=\"Uitgelichte productmerken\" />\n          <Link className=\"font-semibold text-steel hover:text-primary\" href=\"/nl/portfolio/\">\n            Bekijk alles\n          </Link>\n        </div>\n        <div className=\"grid gap-6 md:grid-cols-2 xl:grid-cols-3\">\n          {projectsNl.map((project) => (\n            <ProjectCard key={project.slug} locale=\"nl\" project={project} />\n          ))}\n        </div>\n      </section>\n\n      <section className=\"border-y border-border bg-card\">\n        <div className=\"mx-auto grid max-w-7xl gap-10 px-5 py-16 md:grid-cols-[0.9fr_1.1fr] lg:px-8\">\n          <SectionHeader\n            eyebrow=\"Aanpak\"\n            title=\"Van idee naar markt\"\n            description=\"Core Solutions brengt productideeën van probleemonderzoek naar validatie, ontwerp, testen, merkontwikkeling, productie en commercialisatie. Ieder project begint met een praktisch probleem en groeit uit tot een heldere productpropositie.\"\n          />\n          <div className=\"grid gap-4 sm:grid-cols-3\">\n            {editableMetricsNl.map((metric) => (\n              <MetricCard key={metric.label} {...metric} />\n            ))}\n          </div>\n        </div>\n      </section>\n\n      <section className=\"mx-auto max-w-7xl px-5 py-16 lg:px-8\">\n        <SectionHeader\n          eyebrow=\"In de media\"\n          title=\"Aandacht, vermeldingen en productverhalen\"\n        />\n        <MediaCoverage mentions={mediaHighlightsNl} locale=\"nl\" />\n      </section>\n\n      <SplitCta locale=\"nl\" />\n    </>\n  );\n}\n","scripts/optimize-images.py":"\"\"\"Build responsive assets from immutable originals. Run with Pillow 12.3.0.\"\"\"\nfrom pathlib import Path\nfrom PIL import Image, ImageOps\nimport argparse\nimport difflib\nimport json\nROOT = Path(__file__).resolve().parents[1]\nORIGINALS = ROOT / \"assets/originals/images\"\nPUBLIC = ROOT / \"public/images\"\nOUT = PUBLIC / \"optimized\"\nOUT.mkdir(parents=True, exist_ok=True)\nREPLACEMENTS = {\n \"batbox-product.png\": ROOT / \"assets/originals/replacements/batbox_tester_product.png\",\n \"iheel-product.png\": ROOT / \"assets/originals/replacements/iHeel_pads_product.jpg\",\n \"pillenpopper-product.webp\": ROOT / \"assets/source-images/pillenpopper-cleaned.png\",\n}\nEXTRA_SOURCES = {\n \"press-logos/de-ondernemer-logo.png\": ROOT / \"assets/source-images/media-logos/de-ondernemer-logo.png\",\n \"press-logos/hofstad-radio-logo.png\": ROOT / \"assets/source-images/media-logos/hofstad-radio-logo.png\",\n \"press-logos/dagblad070-logo.png\": ROOT / \"assets/source-images/media-logos/dagblad070-logo.png\",\n \"press-logos/duurzaam-ondernemen-logo.png\": ROOT / \"assets/source-images/media-logos/duurzaam-ondernemen-logo.png\",\n \"press-logos/zoetermeers-dagblad-logo.png\": ROOT / \"assets/source-images/media-logos/zoetermeers-dagblad-logo.png\",\n \"press-logos/rijswijks-dagblad-logo.png\": ROOT / \"assets/source-images/media-logos/rijswijks-dagblad-logo.png\",\n \"rik-van-wieren-founder.jpg\": ROOT / \"assets/originals/replacements/rik-van-wieren-founder.jpg\",\n \"press-logos/haagse-dingen-logo.png\": ROOT / \"assets/source-images/media-logos/haagse-dingen-logo.png\",\n \"media-haagse-dingen.jpg\": ROOT / \"assets/source-images/media-haagse-dingen.jpg\",\n \"press-logos/ad-logo.png\": ROOT / \"assets/source-images/media-logos/ad-logo.png\",\n \"press-logos/omroep-delft-logo.png\": ROOT / \"assets/source-images/media-logos/omroep-delft-logo.png\",\n \"press-logos/dnhc-logo.png\": ROOT / \"assets/source-images/media-logos/dnhc-logo.png\",\n \"press-logos/den-haag-fm-logo.png\": ROOT / \"assets/source-images/media-logos/den-haag-fm-logo.png\",\n \"press-logos/hague-online-logo.png\": ROOT / \"assets/source-images/media-logos/hague-online-logo.png\",\n \"press-logos/impactcity-logo.png\": ROOT / \"assets/source-images/media-logos/impactcity-logo.png\",\n \"split-detail-place.jpg\": ROOT / \"assets/source-images/split-detail-place.jpg\",\n \"split-detail-ready.jpg\": ROOT / \"assets/source-images/split-detail-ready.jpg\",\n \"media-hague-online.jpg\": ROOT / \"assets/source-images/media-hague-online.jpg\",\n \"media-impactcity.jpg\": ROOT / \"assets/source-images/media-impactcity.jpg\",\n \"pillenpopper-blister.jpg\": ROOT / \"assets/originals/replacements/pillenpopper-blister.jpg\",\n}\nparser = argparse.ArgumentParser(description=__doc__)\nparser.add_argument(\"--only\", nargs=\"+\", help=\"Regenerate only the named image keys; preserve other assets\")\nargs = parser.parse_args()\ndef plan(name):\n if name.startswith(\"press-logos/\"):\n  return [80,160,320], \"146px\", \"Media source logos; retain alpha, trim empty margins, never upscale\"\n if name.startswith(\"split-detail-\"):\n  return [160,320,480], \"110px\", \"Pill-splitting detail insets\"\n if name.startswith(\"media-\"):\n  return [320,640,960], \"(min-width: 1280px) 290px, (min-width: 768px) 45vw, calc(100vw - 40px)\", \"Press article thumbnails\"\n if \"logo\" in name:\n  return ([96, 192, 320] if \"core-solutions\" in name else [160, 320, 600]), \"160px\", \"Logo; retain alpha and crisp edges\"\n if \"profile\" in name:\n  return [100,200], \"200px\", \"Founder portrait, displayed up to 200 CSS pixels\"\n if \"skyline\" in name:\n  return [320,480,800], \"(min-width: 1280px) 760px, (min-width: 768px) 60vw, calc(100vw - 40px)\", \"Contact-page panorama; capped at 800 pixels for faster loading\"\n if name.startswith(\"stores/\"):\n  return [480,800], \"(min-width: 1280px) 390px, (min-width: 768px) 45vw, calc(100vw - 40px)\", \"Retail cards, about 390 CSS pixels\"\n return [480,800,1200], \"(min-width: 1280px) 560px, (min-width: 768px) 45vw, calc(100vw - 40px)\", \"Home and product heroes; card-specific sizes supplied in markup\"\nmanifest_path = ROOT / \"src/data/images.generated.json\"\naudit_path = ROOT / \"assets/image-audit.json\"\nmanifest = json.loads(manifest_path.read_text()) if args.only and manifest_path.exists() else {}\naudit = json.loads(audit_path.read_text()) if args.only and audit_path.exists() else []\nsources = {p.relative_to(ORIGINALS).as_posix(): p for p in ORIGINALS.rglob(\"*\") if p.is_file() and p.suffix.lower() != \".svg\"}\nsources.update(EXTRA_SOURCES)\nif args.only:\n unknown = set(args.only) - sources.keys()\n if unknown: parser.error(\"Unknown image keys: \" + \", \".join(sorted(unknown)))\n sources = {name: sources[name] for name in args.only}\n audit = [item for item in audit if item[\"path\"] not in {\"/images/\" + name for name in sources}]\nfor name, original in sorted(sources.items()):\n source=REPLACEMENTS.get(name,original)\n with Image.open(source) as img:\n  img=ImageOps.exif_transpose(img)\n  if img.mode==\"P\": img=img.convert(\"RGBA\" if \"transparency\" in img.info else \"RGB\")\n  elif img.mode not in (\"RGB\",\"RGBA\"): img=img.convert(\"RGB\")\n  if name==\"rik-van-wieren-founder.jpg\":\n   img=ImageOps.fit(img,(1536,1152),Image.Resampling.LANCZOS,centering=(0.78,0.5))\n  widths,sizes,purpose=plan(name)\n  widths=sorted(set(min(w,img.width) for w in widths))\n  alpha=img.mode==\"RGBA\" and img.getextrema()[3][0]<255\n  if not alpha: img=img.convert(\"RGB\")\n  slug=name.rsplit(\".\",1)[0].replace(\"/\",\"--\")\n  variants=[]\n  for width in widths:\n   height=round(img.height*width/img.width)\n   resized=img.resize((width,height),Image.Resampling.LANCZOS)\n   row={\"width\":width,\"height\":height}\n   for fmt in (\"avif\",\"webp\",\"png\" if alpha else \"jpg\"):\n    path=OUT/f\"{slug}-{width}.{fmt}\"\n    if fmt==\"avif\": resized.save(path,\"AVIF\",quality=85 if \"logo\" in name else 44 if \"skyline\" in name else 56 if \"founder\" in name else 72,speed=6,subsampling=\"4:4:4\" if \"logo\" in name else \"4:2:0\")\n    elif fmt==\"webp\": resized.save(path,\"WEBP\",quality=88 if \"logo\" in name else 66 if \"skyline\" in name else 80 if \"founder\" in name else 82,method=6,lossless=alpha)\n    elif fmt==\"png\": resized.save(path,\"PNG\",optimize=True)\n    else: resized.convert(\"RGB\").save(path,\"JPEG\",quality=72 if \"skyline\" in name else 86,optimize=True,progressive=True)\n    with Image.open(path) as check: check.verify()\n    row[fmt]=\"/images/optimized/\"+path.name\n   variants.append(row)\n  largest=variants[-1]\n  manifest[\"/images/\"+name]={\"width\":largest[\"width\"],\"height\":largest[\"height\"],\"sizes\":sizes,\"fallback\":largest[\"png\" if alpha else \"jpg\"],\"variants\":variants}\n  # Retain legacy URLs with a resized fallback. The requested homepage PNG stays byte-for-byte unchanged.\n  legacy=PUBLIC/name\n  legacy.parent.mkdir(parents=True,exist_ok=True)\n  if name!=\"core-solutions-products-hero.png\":\n   legacy_image=img.resize((largest[\"width\"],largest[\"height\"]),Image.Resampling.LANCZOS)\n   if legacy.suffix==\".png\": legacy_image.save(legacy,\"PNG\",compress_level=4)\n   elif legacy.suffix==\".webp\": legacy_image.save(legacy,\"WEBP\",quality=84,method=6)\n   else: legacy_image.convert(\"RGB\").save(legacy,\"JPEG\",quality=72 if \"skyline\" in name else 86,optimize=True,progressive=True)\n  audit.append({\"path\":\"/images/\"+name,\"source\":str(source.relative_to(ROOT)).replace(\"\\\\\",\"/\"),\"originalBytes\":original.stat().st_size,\"sourceWidth\":img.width,\"sourceHeight\":img.height,\"widths\":widths,\"largestAvifBytes\":(ROOT/\"public\"/largest[\"avif\"].lstrip(\"/\")).stat().st_size,\"largestWebpBytes\":(ROOT/\"public\"/largest[\"webp\"].lstrip(\"/\")).stat().st_size,\"purpose\":purpose})\ndef write_json(path, value):\n old = path.read_bytes().decode(\"utf-8\").splitlines(keepends=True) if path.exists() else []\n new = (json.dumps(value,indent=2)+\"\\n\").splitlines(keepends=True)\n output = []\n matcher = difflib.SequenceMatcher(a=[line.rstrip(\"\\r\\n\") for line in old], b=[line.rstrip(\"\\r\\n\") for line in new], autojunk=False)\n for tag,i,j,k,l in matcher.get_opcodes():\n  output.extend(old[i:j] if tag == \"equal\" else new[k:l])\n path.write_bytes(\"\".join(output).encode(\"utf-8\"))\nwrite_json(manifest_path, manifest)\nwrite_json(audit_path, audit)\nprint(json.dumps({\"images\":len(audit),\"variants\":sum(len(v[\"variants\"])*3 for v in manifest.values()),\"originalBytes\":sum(a[\"originalBytes\"] for a in audit),\"largestAvifBytes\":sum(a[\"largestAvifBytes\"] for a in audit)}))\n"}''')
          for name,content in edits.items():
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          urls=json.loads(r'''{"de-ondernemer":"https://images.ctfassets.net/765y2hpj99ul/jeLLGnfnqoM5x2XqrQCcl/bf4d0022495867006d5c23c250b6fa2d/deOndernemer_180x70pixels.jpg","hofstad-radio":"https://www.hofstadradio.com/wp-content/uploads/2025/10/nieuw-logo.png","dagblad070":"https://media.digitaaldagblad.nl/logo/dagblad070.nl.png","duurzaam-ondernemen":"https://www.duurzaam-ondernemen.nl/wordpress/wp-content/themes/haicu6_duon/images/duon-logo.svg","zoetermeers-dagblad":"https://media.digitaaldagblad.nl/logo/zoetermeersdagblad.nl.png","rijswijks-dagblad":"https://media.digitaaldagblad.nl/logo/rijswijksdagblad.nl.jpg"}''')
          manifest=json.loads(Path("assets/source-images/media-logo-sources.json").read_text())
          manifest["updatedOn"]="2026-11-16"
          for key,url in urls.items():
            raw=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=40).read()
            ext=Path(urllib.parse.urlparse(url).path).suffix
            original=Path("assets/originals/media-logos")/(key+"-logo"+ext)
            original.parent.mkdir(parents=True,exist_ok=True);original.write_bytes(raw)
            raster=cairosvg.svg2png(bytestring=raw,output_width=1000) if ext==".svg" else raw
            img=Image.open(io.BytesIO(raster)).convert("RGBA")
            if img.getchannel("A").getextrema()[0]<255:
              bbox=img.getchannel("A").getbbox()
              if bbox: img=img.crop(bbox)
            elif all(min(img.getpixel(point)[:3])>=250 for point in [(0,0),(img.width-1,0),(0,img.height-1),(img.width-1,img.height-1)]):
              difference=ImageChops.difference(img.convert("RGB"),Image.new("RGB",img.size,"white")).convert("L")
              bbox=difference.point(lambda x:255 if x>8 else 0).getbbox()
              if bbox: img=img.crop(bbox)
            prepared=Path("assets/source-images/media-logos")/(key+"-logo.png")
            prepared.parent.mkdir(parents=True,exist_ok=True);img.save(prepared,optimize=True)
            manifest["logos"].append({"sourceUrl":url,"original":str(original),"prepared":str(prepared),"sha256":hashlib.sha256(raw).hexdigest()})
            print("PREPARED",key,img.size,len(raw),flush=True)
          Path("assets/source-images/media-logo-sources.json").write_text(json.dumps(manifest,indent=2)+"\n")
          keys=["press-logos/"+key+"-logo.png" for key in urls]
          subprocess.run(["python","scripts/optimize-images.py","--only",*keys],check=True)
          changed=subprocess.check_output(["git","ls-files","--modified","--others","--exclude-standard"],text=True).splitlines()
          for name in changed:
            if name in edits: continue
            data=base64.b64encode(Path(name).read_bytes()).decode()
            for part in range(0,len(data),24000):
              print("MEDIAFILE "+json.dumps({"path":name,"offset":part,"total":len(data),"data":data[part:part+24000]}),flush=True)
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build website
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify media coverage
        run: |
          python -m http.server 8765 --directory out > /tmp/media-server.log 2>&1 &
          cat > /tmp/check-media.cjs <<'TEST'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
           const browser=await chromium.launch({headless:true});
           const pages=['/nl/','/','/nl/portfolio/pillenpopper/','/portfolio/pillenpopper/'];
           const results=[];
           for(const width of [1440,390]){
            const page=await browser.newPage({viewport:{width,height:1000},deviceScaleFactor:1});
            for(const path of pages){
             await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'networkidle'});
             const region=page.getByRole('region',{name:/Uitgelichte media|Featured coverage/});
             if(await region.count()!==1)throw Error(path+' missing featured region');
             if(await region.locator('article').count()!==3)throw Error('Featured count');
             const logos=await region.locator('img[alt]:not([alt=""])').evaluateAll(imgs=>imgs.map(img=>img.alt));
             if(logos.join('|')!=='AD|Omroep Delft|De Ondernemer')throw Error('Featured order '+logos);
             const details=page.locator('details').filter({has:page.locator('summary').filter({hasText:/overige|more media/})});
             if(await details.count()!==1)throw Error('Details count');
             if(await details.getAttribute('open')!==null)throw Error('Starts expanded');
             if(await details.locator('article').count()!==11)throw Error('Remaining count');
             await details.locator('summary').focus();await page.keyboard.press('Enter');
             if(await details.getAttribute('open')===null)throw Error('Keyboard did not expand');
             await details.scrollIntoViewIfNeeded();
             const allLogoImages=page.locator('img[alt]').filter({hasNotText:'unused'});
             const section=region.locator('..');
             for(const img of await section.locator('img').all()){
              await img.scrollIntoViewIfNeeded();
              await img.evaluate(img=>img.decode());
              const size=await img.evaluate(img=>[img.naturalWidth,img.naturalHeight]);
              if(size[0]===0)throw Error('Logo/image did not load');
             }
             const fallbackText=await details.locator('article').count();
             const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth);
             if(overflow)throw Error('Viewport overflow '+path+' '+width);
             await details.locator('summary').click();
             if(await details.getAttribute('open')!==null)throw Error('Did not collapse');
             await region.scrollIntoViewIfNeeded();
             if(width===390){
               const scrolled=await region.evaluate(el=>{el.scrollLeft=0;const before=el.scrollLeft;el.scrollLeft=el.scrollWidth;return el.scrollWidth>el.clientWidth&&el.scrollLeft>before});
               if(!scrolled)throw Error('Featured swipe unavailable');
               await region.evaluate(el=>el.scrollLeft=0);
             }
             if(path==='/nl/'){
              const buffer=await section.screenshot({type:'png'});
              const data=buffer.toString('base64');
              for(let offset=0;offset<data.length;offset+=24000)console.log('MEDIASHOT '+JSON.stringify({width,offset,total:data.length,data:data.slice(offset,offset+24000)}));
             }
             results.push({path,width,featured:logos,remaining:fallbackText,keyboard:'pass',images:'pass',overflow:false});
            }
            await page.close();
           }
           console.log('MEDIARESULT '+JSON.stringify(results));
           await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          
          TEST
          NODE_PATH="$PWD/node_modules" node /tmp/check-media.cjs
